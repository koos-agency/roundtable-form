<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <style>
    /* Koos colour primitives */
    :root {
      --dark-blue: #001820;
      --koos-blue: #006FF7;
      --orange: #FF501F;
      --pink: #FFBFC0;
      --white: #FFFFFF;
      --black: #1C1C1C;
      --neutral-50: #F7F5F2;
      --neutral-100: #EAE7E3;
      --neutral-200: #D5D1CB;
      --neutral-500: #635E57;

      /* set per screen by JS */
      --bg: var(--koos-blue);
      --fg: var(--white);
      --accent: var(--pink);
      --on-accent: var(--dark-blue);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      transition: background-color .5s ease, color .5s ease;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Decorative "oo" rings that echo the koos wordmark */
    .decor { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .ring {
      position: absolute; border-radius: 50%;
      border: clamp(28px, 5vw, 56px) solid var(--accent);
      opacity: .9;
      transition: border-color .5s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
    }
    .ring.r1 { width: 46vmin; height: 46vmin; right: -10vmin; bottom: -14vmin; }
    .ring.r2 { width: 46vmin; height: 46vmin; right: 22vmin; bottom: -14vmin; border-color: var(--fg); opacity: .12; }
    .blob {
      position: absolute; width: 14vmin; height: 14vmin; border-radius: 50%;
      background: var(--accent); top: 12vh; right: 6vw; opacity: .9;
      transition: background-color .5s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
      animation: bob 6s ease-in-out infinite;
    }
    @keyframes bob { 50% { translate: 0 -18px; } }

    /* Top bar */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 3;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: 24px clamp(16px, 5vw, 64px);
    }

    .progress { flex: 0 1 280px; display: flex; align-items: center; gap: 12px; font-size: .875rem; font-weight: 600; }
    .progress[hidden] { display: none; }
    .bar { flex: 1; height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--fg) 20%, transparent); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: var(--fg); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }

    /* Stage */
    main {
      position: relative; z-index: 1; height: 100%;
      display: flex; align-items: center;
      padding: 96px clamp(16px, 5vw, 64px) 120px;
      overflow-y: auto;
    }
    .screen { width: 100%; max-width: 760px; animation: enter .55s cubic-bezier(.2,.8,.2,1) both; }
    .screen.leaving { animation: leave .3s ease both; }
    .screen.back { animation-name: enter-back; }
    @keyframes enter { from { opacity: 0; transform: translateY(40px); } }
    @keyframes enter-back { from { opacity: 0; transform: translateY(-40px); } }
    @keyframes leave { to { opacity: 0; transform: translateY(-24px); } }

    .tagline {
      display: inline-block; font-size: .875rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      background: var(--accent); color: var(--on-accent);
      padding: 8px 14px; border-radius: 99px; margin-bottom: 24px;
      transform: rotate(-2deg);
    }
    h1 { font-size: 3.5rem; line-height: 1.2; font-weight: 500; letter-spacing: -0.03em; margin: 0 0 24px; }
    h2 { font-size: 3rem; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 16px; }
    .lead { font-size: 1.25rem; line-height: 1.4; margin: 0 0 32px; max-width: 620px; opacity: .9; }
    .help { font-size: 1.125rem; line-height: 1.4; margin: 0 0 32px; opacity: .85; max-width: 620px; }
    .req { color: var(--accent); }
    .meta { font-size: 1rem; font-weight: 600; margin-top: 20px; opacity: .85; }

    /* Inputs */
    .text-input, textarea {
      width: 100%; font: inherit; color: var(--fg); background: transparent;
      border: 0; border-bottom: 3px solid color-mix(in srgb, var(--fg) 40%, transparent);
      font-size: 2rem; font-weight: 500; padding: 8px 0 12px; outline: none;
      transition: border-color .2s ease;
    }
    textarea {
      font-size: 1.25rem; line-height: 1.5; min-height: 180px; resize: vertical;
      border: 3px solid color-mix(in srgb, var(--fg) 40%, transparent); border-radius: 20px; padding: 20px;
    }
    .text-input::placeholder, textarea::placeholder { color: var(--fg); opacity: .4; }
    .text-input:focus, textarea:focus { border-color: var(--fg); }

    /* Honesty meter under long answers */
    .meter { margin-top: 16px; display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: .9375rem; }
    .meter .bar { height: 14px; max-width: 260px; }
    .meter .bar span { background: var(--accent); }

    /* Choice cards */
    .choices { display: grid; gap: 12px; max-width: 520px; }
    .choice {
      display: flex; align-items: center; gap: 16px; width: 100%;
      font: inherit; font-size: 1.25rem; font-weight: 600; text-align: left; color: var(--fg);
      background: color-mix(in srgb, var(--fg) 10%, transparent);
      border: 3px solid color-mix(in srgb, var(--fg) 35%, transparent);
      border-radius: 18px; padding: 16px 20px; cursor: pointer;
      transition: transform .15s ease, background-color .2s ease, border-color .2s ease;
    }
    .choice:hover { transform: translateX(6px); border-color: var(--fg); }
    .choice .key {
      flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
      font-size: .875rem; border: 2px solid currentColor;
    }
    .choice[aria-checked="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .choice[aria-checked="true"] .key { background: var(--bg); color: var(--fg); border-color: var(--bg); }
    .other-input { margin-top: 8px; font-size: 1.25rem; }

    /* Sliders */
    .slider-wrap { max-width: 640px; }
    .slider-value { font-size: 3.5rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; min-height: 1.2em; }
    .slider-value.unset { opacity: .45; font-weight: 500; }
    .slider-sub { font-size: 1.125rem; margin: 4px 0 32px; min-height: 1.5em; opacity: .85; }
    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 18px; border-radius: 99px;
      background: linear-gradient(to right, var(--accent) var(--fill, 0%), color-mix(in srgb, var(--fg) 22%, transparent) var(--fill, 0%));
      outline: none; cursor: pointer; margin: 0;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 48px; height: 48px; border-radius: 50%;
      background: var(--fg); border: 6px solid var(--accent); box-shadow: 0 6px 0 color-mix(in srgb, var(--dark-blue) 30%, transparent);
      transition: transform .15s ease;
    }
    input[type=range]::-moz-range-thumb {
      width: 36px; height: 36px; border-radius: 50%; background: var(--fg); border: 6px solid var(--accent);
    }
    input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
    input[type=range].unset::-webkit-slider-thumb { opacity: .55; }
    input[type=range]:focus-visible { box-shadow: 0 0 0 4px var(--fg); }
    .stops { display: flex; justify-content: space-between; margin-top: 16px; }
    .stop {
      font: inherit; font-size: 1rem; font-weight: 600; color: var(--fg); background: none; border: 0;
      padding: 6px 4px; cursor: pointer; opacity: .6;
    }
    .stop[aria-pressed="true"] { opacity: 1; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
    .clear { font: inherit; font-size: .875rem; color: var(--fg); background: none; border: 0; margin-top: 20px; padding: 0; text-decoration: underline; cursor: pointer; opacity: .7; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 12px;
      font: inherit; font-size: 1.125rem; font-weight: 700; cursor: pointer;
      background: var(--fg); color: var(--bg); border: 0; border-radius: 99px;
      padding: 18px 30px; box-shadow: 0 6px 0 color-mix(in srgb, var(--dark-blue) 35%, transparent);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 color-mix(in srgb, var(--dark-blue) 35%, transparent); }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--dark-blue) 35%, transparent); }
    .btn[disabled] { opacity: .6; cursor: wait; }
    .btn .arrow { transition: transform .2s ease; }
    .btn:hover .arrow { transform: translateX(4px); }
    .btn-ghost {
      font: inherit; font-size: 1rem; font-weight: 600; color: var(--fg); background: none;
      border: 2px solid color-mix(in srgb, var(--fg) 40%, transparent); border-radius: 99px; padding: 12px 20px; cursor: pointer;
    }
    .btn-ghost:hover { border-color: var(--fg); }
    .actions { display: flex; align-items: center; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
    .hint { font-size: .875rem; opacity: .7; }
    .hint kbd { font: inherit; font-weight: 700; border: 1.5px solid currentColor; border-radius: 6px; padding: 1px 6px; }

    footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 3;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px clamp(16px, 5vw, 64px); pointer-events: none;
    }
    footer > * { pointer-events: auto; }
    footer a { color: var(--fg); font-size: .875rem; opacity: .7; }

    .error {
      margin-top: 20px; font-weight: 600; font-size: 1rem;
      background: var(--fg); color: var(--bg); display: inline-block; padding: 10px 16px; border-radius: 12px;
    }
    .error a { color: inherit; }

    :focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }
    .text-input:focus-visible, textarea:focus-visible { outline: none; }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 4; }

    @media (max-width: 720px) {
      h1 { font-size: 2.5rem; }
      h2 { font-size: 2rem; }
      .text-input { font-size: 1.5rem; }
      .slider-value { font-size: 2.5rem; }
      .logo { height: 28px; }
      .progress { flex-basis: 150px; }
      .hint { display: none; }
      .ring.r2 { display: none; }
      .blob { top: 76px; right: 16px; width: 56px; height: 56px; transform: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="decor" aria-hidden="true">
    <div class="ring r2"></div>
    <div class="ring r1"></div>
    <div class="blob"></div>
  </div>

  <header>
    <div class="logo" role="img" aria-label="Koos"></div>
    <div class="progress" id="progress" hidden>
      <span id="progress-label"></span>
      <div class="bar"><span id="progress-fill"></span></div>
    </div>
  </header>

  <main id="stage" aria-live="polite"></main>

  <footer>
    <button class="btn-ghost" id="back" type="button" hidden>← Back</button>
    <span></span>
  </footer>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script>
    // ---------- Data ----------

    // Copy of the Google Form. Answers are posted straight to `action`, so they land in the
    // form's own responses and linked Sheet. `entry` is Google's hidden field id for each
    // question: if a question is edited or added in the Google Form, update it here too.
    const FORM = {
      title: 'Which AI challenges are you facing?',
      description: 'Tell us what your challenges are for deciding on, building and launching AI products, processes, and services. We use your answers to seat you at the right roundtable.',
      originalUrl: 'https://docs.google.com/forms/d/e/1FAIpQLScqFjlbMQ7-OWaL1wNnHrtBrs_1oJgy2JKkpi-5AN4aCi5kMQ/viewform',
      action: 'https://docs.google.com/forms/d/e/1FAIpQLScqFjlbMQ7-OWaL1wNnHrtBrs_1oJgy2JKkpi-5AN4aCi5kMQ/formResponse',
      pageHistory: '0,1,2', // every page of the Google Form, so it accepts the answers from all of them
      sections: [
        { title: 'About you', help: 'Tell us a bit about yourself.', items: [
          { id: 1518823693, entry: 599453546, type: 'text', title: 'What is your name?', help: '', required: false },
          { id: 1699998064, entry: 371880519, type: 'text', title: 'What’s your job role?', help: '', required: false },
          { id: 1204841250, entry: 1743934678, type: 'text', title: 'Which organization do you work for?', help: '', required: false }
        ]},
        { title: 'Your biggest challenge', help: 'Tell us what you want to achieve with AI and what’s in your way. Think about your own situation and be honest about where you’re stuck helps us put you at the table that can actually move you forward.', items: [
          { id: 807275436, entry: 745463687, type: 'paragraph', title: 'Where do you get stuck with AI, what is your biggest challenge?', help: '', required: false },
          { id: 1730444328, entry: 2058185056, type: 'choice', title: 'In which phase does this challenge sit?', help: '', required: false, choices: ['Strategy', 'Build', 'Adoption'], hasOther: false }
        ]}
      ]
    };

    // Add ?preview to the URL to click through without sending anything.
    const PREVIEW = new URLSearchParams(location.search).has('preview');

    // ---------- Look and copy ----------

    const THEMES = [
      { bg: '#006FF7', fg: '#FFFFFF', accent: '#FFBFC0', onAccent: '#001820' }, // Koos blue
      { bg: '#FFBFC0', fg: '#001820', accent: '#006FF7', onAccent: '#FFFFFF' }, // pink
      { bg: '#001820', fg: '#FFFFFF', accent: '#FF501F', onAccent: '#001820' }, // dark blue
      { bg: '#FF501F', fg: '#001820', accent: '#FFFFFF', onAccent: '#001820' }, // orange
      { bg: '#F7F5F2', fg: '#1C1C1C', accent: '#006FF7', onAccent: '#FFFFFF' }  // neutral
    ];

    // Playful lines around the real questions. The question text itself is never changed.
    // Matched on the question title, so new or renamed questions fall back to generic lines.
    const FLAVOUR = [
      { match: /your name/i, kicker: 'First things first', placeholder: 'Type your name' },
      { match: /job role|role/i, kicker: 'The day job', placeholder: 'e.g. Head of Product' },
      { match: /organi[sz]ation|company/i, kicker: 'Your home base', placeholder: 'e.g. Acme Group' },
      { match: /phase/i, kicker: 'Slide it to where it hurts', slider: true,
        notes: { Strategy: 'Deciding what’s worth doing', Build: 'Making it actually work', Adoption: 'Getting people to use it' } },
      { match: /stuck|challenge/i, kicker: 'Be honest. Nobody’s grading this', placeholder: 'Spill it. The messier, the better.' }
    ];
    const GENERIC_KICKERS = ['Quick one', 'Over to you', 'Hit us', 'Nearly there', 'Last stretch'];
    const SECTION_KICKERS = ['Warm-up', 'The good stuff', 'Round three', 'Round four'];
    const SECTION_BUTTONS = ['Let’s do this', 'Bring it on', 'Keep going', 'Onwards'];

    const METER_STEPS = [
      [0, 'Waiting for the good stuff'],
      [1, 'Warming up'],
      [60, 'Now we’re talking'],
      [180, 'This is gold'],
      [400, 'Pure roundtable fuel']
    ];

    function flavourFor(item) {
      return FLAVOUR.find(f => f.match.test(item.title)) || {};
    }

    // ---------- Screens ----------

    const screens = [{ kind: 'welcome' }];
    FORM.sections.forEach((section, s) => {
      if (section.title || section.help) screens.push({ kind: 'section', section, index: s });
      section.items.forEach(item => screens.push({ kind: 'question', item }));
    });
    screens.push({ kind: 'done' });

    const questionScreens = screens.filter(s => s.kind === 'question');
    const answers = {};
    let current = 0;
    let submitting = false;

    const stage = document.getElementById('stage');
    const backBtn = document.getElementById('back');

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v === true ? '' : v);
      }
      children.flat().forEach(c => c != null && node.append(c));
      return node;
    }

    // Like node.append, but skips null so optional parts can be passed inline.
    function put(node, ...children) {
      children.flat().forEach(c => c != null && node.append(c));
      return node;
    }

    function applyTheme(i) {
      const t = THEMES[i % THEMES.length];
      const root = document.documentElement.style;
      root.setProperty('--bg', t.bg);
      root.setProperty('--fg', t.fg);
      root.setProperty('--accent', t.accent);
      root.setProperty('--on-accent', t.onAccent);
      document.querySelector('meta[name=theme-color]')?.setAttribute('content', t.bg);
      // Nudge the decorative shapes so every screen feels a bit different.
      const r = document.querySelector('.ring.r1');
      const b = document.querySelector('.blob');
      r.style.transform = `rotate(${i * 40}deg) translate(${(i % 3) * -3}vmin, ${(i % 2) * -4}vmin)`;
      b.style.transform = `translate(${(i % 4) * -3}vw, ${(i % 3) * -3}vh) scale(${1 + (i % 3) * .2})`;
    }

    function updateChrome() {
      const screen = screens[current];
      const qIndex = questionScreens.indexOf(screen);
      const progress = document.getElementById('progress');
      const shown = screen.kind === 'question' || screen.kind === 'section';
      progress.hidden = !shown;
      if (shown) {
        const answered = screen.kind === 'question' ? qIndex : questionScreens.indexOf(screens[current + 1]);
        document.getElementById('progress-label').textContent =
          screen.kind === 'question' ? `${qIndex + 1}/${questionScreens.length}` : `${answered}/${questionScreens.length}`;
        document.getElementById('progress-fill').style.width = `${(answered / questionScreens.length) * 100}%`;
      }
      backBtn.hidden = current === 0 || screen.kind === 'done';
    }

    function go(to, direction = 1) {
      const old = stage.firstElementChild;
      const render = () => {
        current = to;
        applyTheme(current);
        stage.replaceChildren(buildScreen(screens[current], direction));
        updateChrome();
        stage.scrollTop = 0;
        const focusable = stage.querySelector('[data-autofocus]');
        if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 350);
      };
      if (old) { old.classList.add('leaving'); setTimeout(render, 220); }
      else render();
    }

    function next() {
      const screen = screens[current];
      if (screen.kind === 'question') {
        const err = validate(screen.item);
        if (err) return showError(err);
        if (screen === questionScreens[questionScreens.length - 1]) return submit();
      }
      go(current + 1, 1);
    }

    function back() { if (current > 0 && !submitting) go(current - 1, -1); }

    function isEmpty(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length); }

    function validate(item) {
      if (item.required && isEmpty(answers[item.id])) return 'This one’s required. Give it a go.';
      return null;
    }

    function showError(msg, html) {
      const box = stage.querySelector('.error') || stage.querySelector('.screen').appendChild(el('div', { class: 'error', role: 'alert' }));
      if (html) box.innerHTML = html; else box.textContent = msg;
    }

    function buildScreen(screen, direction) {
      const wrap = el('section', { class: 'screen' + (direction < 0 ? ' back' : '') });
      if (screen.kind === 'welcome') return buildWelcome(wrap);
      if (screen.kind === 'section') return buildSection(wrap, screen);
      if (screen.kind === 'question') return buildQuestion(wrap, screen.item);
      return buildDone(wrap);
    }

    function buildWelcome(wrap) {
      const n = questionScreens.length;
      const minutes = Math.max(1, Math.round(n * 0.6));
      put(wrap, 
        el('div', { class: 'tagline', text: 'Koos & Co Roundtable' }),
        el('h1', { text: FORM.title }),
        FORM.description ? el('p', { class: 'lead', text: FORM.description }) : null,
        el('div', { class: 'actions' },
          el('button', { class: 'btn', type: 'button', onclick: next, 'data-autofocus': true },
            'Let’s go', el('span', { class: 'arrow', text: '→' }))
        ),
        el('p', { class: 'meta', text: `${n} questions · about ${minutes} minute${minutes > 1 ? 's' : ''} · zero wrong answers` })
      );
      return wrap;
    }

    function buildSection(wrap, screen) {
      const total = FORM.sections.length;
      put(wrap, 
        el('div', { class: 'tagline', text: total > 1 ? `Part ${screen.index + 1} of ${total} · ${SECTION_KICKERS[screen.index] || 'Next up'}` : SECTION_KICKERS[0] }),
        el('h1', { text: screen.section.title }),
        screen.section.help ? el('p', { class: 'lead', text: screen.section.help }) : null,
        el('div', { class: 'actions' },
          el('button', { class: 'btn', type: 'button', onclick: next, 'data-autofocus': true },
            SECTION_BUTTONS[screen.index] || 'Keep going', el('span', { class: 'arrow', text: '→' }))
        )
      );
      return wrap;
    }

    function buildQuestion(wrap, item) {
      const flavour = flavourFor(item);
      const qIndex = questionScreens.findIndex(s => s.item === item);
      const isLast = qIndex === questionScreens.length - 1;
      const inputId = 'q-' + item.id;

      put(wrap, 
        el('div', { class: 'tagline', text: flavour.kicker || GENERIC_KICKERS[qIndex % GENERIC_KICKERS.length] }),
        el('h2', { id: inputId + '-label' }, item.title, item.required ? el('span', { class: 'req', text: ' *', 'aria-label': 'required' }) : null),
        item.help ? el('p', { class: 'help', text: item.help }) : null
      );

      let hint = null;
      if (item.type === 'text') {
        const input = el('input', {
          class: 'text-input', id: inputId, type: 'text', autocomplete: 'off',
          placeholder: flavour.placeholder || 'Type your answer', 'aria-labelledby': inputId + '-label',
          'data-autofocus': true, required: item.required,
          oninput: e => { answers[item.id] = e.target.value; },
          onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); next(); } }
        });
        input.value = answers[item.id] || '';
        put(wrap, input);
        hint = el('span', { class: 'hint' }, 'or press ', el('kbd', { text: 'Enter' }));
      } else if (item.type === 'paragraph') {
        put(wrap, buildParagraph(item, flavour, inputId));
        hint = el('span', { class: 'hint' }, 'or press ', el('kbd', { text: navigator.platform.includes('Mac') ? '⌘ + Enter' : 'Ctrl + Enter' }));
      } else if ((item.type === 'choice' && flavour.slider && !item.hasOther) || item.type === 'scale') {
        put(wrap, buildSlider(item, flavour, inputId));
      } else if (item.type === 'choice' || item.type === 'checkbox') {
        put(wrap, buildChoices(item, inputId));
        hint = el('span', { class: 'hint' }, 'tip: press ', el('kbd', { text: 'A' }), ', ', el('kbd', { text: 'B' }), '…');
      } else {
        put(wrap, el('p', { class: 'help' }, 'This question type isn’t in the new interface yet. ',
          el('a', { href: FORM.originalUrl, target: '_blank', rel: 'noopener', style: 'color:inherit', text: 'Answer it in the original form' }), '.'));
      }

      put(wrap, el('div', { class: 'actions' },
        el('button', { class: 'btn', type: 'button', onclick: next, id: 'next-btn' },
          isLast ? 'Send it' : 'Next', el('span', { class: 'arrow', text: isLast ? '↗' : '→' })),
        hint
      ));
      return wrap;
    }

    function buildParagraph(item, flavour, inputId) {
      const fill = el('span');
      const label = el('span');
      const area = el('textarea', {
        id: inputId, 'aria-labelledby': inputId + '-label', placeholder: flavour.placeholder || 'Type your answer',
        'data-autofocus': true, required: item.required,
        oninput: e => { answers[item.id] = e.target.value; updateMeter(); },
        onkeydown: e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); next(); } }
      });
      area.value = answers[item.id] || '';
      function updateMeter() {
        const len = area.value.trim().length;
        const step = [...METER_STEPS].reverse().find(([min]) => len >= min);
        label.textContent = step[1];
        fill.style.width = Math.min(100, (len / 400) * 100) + '%';
      }
      updateMeter();
      return el('div', {}, area, el('div', { class: 'meter', 'aria-live': 'polite' },
        el('div', { class: 'bar', 'aria-hidden': 'true' }, fill), label));
    }

    function buildSlider(item, flavour, inputId) {
      // Choice questions use their options as stops; scale questions use their numbers.
      const stops = item.type === 'scale'
        ? Array.from({ length: item.max - item.min + 1 }, (_, i) => String(item.min + i))
        : item.choices;
      const notes = flavour.notes || {};
      const valueEl = el('div', { class: 'slider-value', 'aria-hidden': 'true' });
      const subEl = el('div', { class: 'slider-sub', 'aria-hidden': 'true' });
      const range = el('input', {
        type: 'range', id: inputId, min: 0, max: stops.length - 1, step: 1,
        'aria-labelledby': inputId + '-label', 'data-autofocus': true,
        oninput: e => set(stops[Number(e.target.value)])
      });
      const stopButtons = stops.map(s => el('button', { class: 'stop', type: 'button', text: s, onclick: () => set(s) }));

      function set(value) {
        answers[item.id] = value === null ? '' : (item.type === 'scale' ? Number(value) : value);
        render();
      }
      function render() {
        const v = answers[item.id];
        const idx = isEmpty(v) ? -1 : stops.indexOf(String(v));
        range.classList.toggle('unset', idx < 0);
        range.value = Math.max(0, idx);
        range.style.setProperty('--fill', idx < 0 ? '0%' : `${(idx / (stops.length - 1)) * 100}%`);
        range.setAttribute('aria-valuetext', idx < 0 ? 'No answer yet' : stops[idx]);
        valueEl.classList.toggle('unset', idx < 0);
        valueEl.textContent = idx < 0 ? 'Drag me' : stops[idx];
        subEl.textContent = idx < 0
          ? (item.type === 'scale' ? `${item.minLabel || stops[0]} to ${item.maxLabel || stops[stops.length - 1]}` : 'Or tap a phase below')
          : (notes[stops[idx]] || (idx === 0 && item.minLabel) || (idx === stops.length - 1 && item.maxLabel) || '');
        stopButtons.forEach((b, i) => b.setAttribute('aria-pressed', String(i === idx)));
        clear.hidden = idx < 0 || item.required;
      }
      const clear = el('button', { class: 'clear', type: 'button', text: 'Clear my answer', onclick: () => set(null) });
      render();
      return el('div', { class: 'slider-wrap' }, valueEl, subEl, range, el('div', { class: 'stops' }, stopButtons), clear);
    }

    function buildChoices(item, inputId) {
      const multi = item.type === 'checkbox';
      const options = item.choices.slice();
      const box = el('div', { class: 'choices', role: multi ? 'group' : 'radiogroup', 'aria-labelledby': inputId + '-label' });
      const otherInput = item.hasOther ? el('input', {
        class: 'text-input other-input', type: 'text', placeholder: 'Your own answer', hidden: true,
        oninput: () => sync()
      }) : null;
      let otherOn = false;

      const selected = () => [].concat(answers[item.id] || []);
      if (item.hasOther) {
        const known = selected().filter(v => !options.includes(v));
        if (known.length) { otherOn = true; otherInput.value = known[0]; }
      }

      const cards = options.map((label, i) => el('button', {
        class: 'choice', type: 'button', role: multi ? 'checkbox' : 'radio', 'data-autofocus': i === 0 || null,
        onclick: () => toggle(label)
      }, el('span', { class: 'key', text: String.fromCharCode(65 + i) }), label));
      if (item.hasOther) {
        cards.push(el('button', { class: 'choice', type: 'button', role: multi ? 'checkbox' : 'radio', onclick: () => toggleOther() },
          el('span', { class: 'key', text: String.fromCharCode(65 + options.length) }), 'Other'));
      }

      function toggle(label) {
        if (multi) {
          const set = selected().filter(v => options.includes(v));
          const i = set.indexOf(label);
          i < 0 ? set.push(label) : set.splice(i, 1);
          answers[item.id] = set;
          sync(true);
        } else {
          otherOn = false;
          answers[item.id] = answers[item.id] === label ? '' : label;
          render();
          if (answers[item.id]) setTimeout(next, 450); // single choice: hop to the next question
        }
      }
      function toggleOther() {
        otherOn = !otherOn;
        if (!multi && otherOn) answers[item.id] = otherInput.value;
        sync();
        if (otherOn) otherInput.focus();
      }
      function sync() {
        const other = otherOn && otherInput ? otherInput.value.trim() : '';
        if (multi) {
          const set = selected().filter(v => options.includes(v));
          if (other) set.push(other);
          answers[item.id] = set;
        } else if (otherOn) {
          answers[item.id] = other;
        }
        render();
      }
      function render() {
        const sel = selected();
        cards.forEach((c, i) => {
          const on = i < options.length ? sel.includes(options[i]) : otherOn;
          c.setAttribute('aria-checked', String(on));
        });
        if (otherInput) otherInput.hidden = !otherOn;
      }
      render();

      box.addEventListener('keydown', e => {
        const i = e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) - 65 : -1;
        if (i >= 0 && i < cards.length && e.target.tagName !== 'INPUT') { e.preventDefault(); cards[i].click(); }
      });
      box.append(...cards);
      if (otherInput) box.append(otherInput);
      return box;
    }

    function buildDone(wrap) {
      const nameItem = questionScreens.map(s => s.item).find(i => /your name/i.test(i.title));
      const first = nameItem && answers[nameItem.id] ? String(answers[nameItem.id]).trim().split(/\s+/)[0] : '';
      put(wrap, 
        el('div', { class: 'tagline', text: 'Sent' }),
        el('h1', { text: first ? `Thanks, ${first}. That’s a wrap.` : 'Thanks. That’s a wrap.' }),
        el('p', { class: 'lead', text: 'Your answers are in. We’ll use them to find you the table that can actually move you forward.' })
      );
      setTimeout(confetti, 300);
      return wrap;
    }

    // ---------- Submit ----------

    function submit() {
      if (submitting) return;
      const missing = questionScreens.find(s => validate(s.item));
      if (missing) return go(screens.indexOf(missing), -1);

      submitting = true;
      const btn = document.getElementById('next-btn');
      btn.disabled = true;
      btn.firstChild.textContent = 'Sending…';

      const done = () => { submitting = false; go(screens.length - 1, 1); };
      const fail = err => {
        submitting = false;
        btn.disabled = false;
        btn.firstChild.textContent = 'Try again';
        showError(null, 'That didn’t go through, but your answers are still here. Try again, or use the ' +
          `<a href="${FORM.originalUrl}" target="_blank" rel="noopener">original form</a>.`);
        console.error(err);
      };

      if (PREVIEW) {
        console.info('Preview mode, not submitted:', JSON.stringify(answers));
        return setTimeout(done, 700);
      }

      const body = new URLSearchParams();
      questionScreens.forEach(({ item }) => {
        const value = answers[item.id];
        if (isEmpty(value)) return;
        [].concat(value).forEach(v => {
          const text = String(v).trim();
          if (item.hasOther && !item.choices.includes(text)) {
            body.append(`entry.${item.entry}`, '__other_option__');
            body.append(`entry.${item.entry}.other_option_response`, text);
          } else {
            body.append(`entry.${item.entry}`, text);
          }
        });
      });
      body.append('pageHistory', FORM.pageHistory);

      // Google doesn't let a page read the form's reply ("no-cors"), so a network
      // error is the only failure we can see. Test with a real submission after edits.
      fetch(FORM.action, { method: 'POST', mode: 'no-cors', body }).then(done, fail);
    }

    // ---------- Confetti ----------

    function confetti() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
      ctx.scale(dpr, dpr);
      const colours = ['#006FF7', '#FF501F', '#FFBFC0', '#FFFFFF', '#001820'];
      const bits = Array.from({ length: 160 }, () => ({
        x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .55,
        vx: (Math.random() - .5) * 16, vy: -Math.random() * 18 - 6,
        r: Math.random() * 6 + 4, c: colours[Math.floor(Math.random() * colours.length)],
        round: Math.random() > .5, a: Math.random() * Math.PI, va: (Math.random() - .5) * .3
      }));
      const start = performance.now();
      (function frame(t) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        bits.forEach(b => {
          b.vy += .45; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.a += b.va;
          ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c;
          if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill(); }
          else ctx.fillRect(-b.r, -b.r / 2, b.r * 2, b.r);
          ctx.restore();
        });
        if (t - start < 3500) requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, innerWidth, innerHeight);
      })(start);
    }

    // ---------- Start ----------

    backBtn.addEventListener('click', back);
    go(0);
  </script>
</body>
</html>
