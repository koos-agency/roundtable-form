  <title>Koos & Ko Roundtable</title>

  <style>
    /* ITC Caslon, the heading face of koos.agency, loaded from Koos's own site */
    @font-face { font-family: "ITC Caslon"; src: url("https://koos.agency/app/themes/koos/assets/fonts/ITC_Caslon-Book.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "ITC Caslon"; src: url("https://koos.agency/app/themes/koos/assets/fonts/ITC_Caslon-BookItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
    @font-face { font-family: "ITC Caslon"; src: url("https://koos.agency/app/themes/koos/assets/fonts/ITC_Caslon-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

    :root {
      --dark-blue: #001820;
      --light-blue: #00B9F2;
      --white: #FFFFFF;
      --off-white: #FEFDFB;
      --page: #F3F3F4;

      /* panel tokens, flipped on dark panels */
      --panel: var(--white);
      --ink: var(--dark-blue);
      --muted: #4A5464;
      --line: #E3E4E6;
      --soft: #F3F3F4;
      --btn-bg: var(--dark-blue);
      --btn-ink: var(--white);

      --serif: "ITC Caslon", "Libre Caslon Text", Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
      --radius: 16px;
      --gap: 8px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      font-size: 1rem;
      background: var(--page);
      color: var(--dark-blue);
      -webkit-font-smoothing: antialiased;
    }

    .panel { background: var(--panel); color: var(--ink); border-radius: var(--radius); }
    .dark {
      --panel: var(--dark-blue);
      --ink: var(--off-white);
      --muted: rgba(254, 253, 251, .66);
      --line: rgba(254, 253, 251, .16);
      --soft: rgba(254, 253, 251, .08);
      --btn-bg: var(--light-blue);
      --btn-ink: var(--dark-blue);
    }

    /* ---------- Shell: a rail of small panels next to one big stage ---------- */
    .shell {
      display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: var(--gap);
      padding: var(--gap); min-height: 100vh; min-height: 100dvh;
    }
    .rail { display: flex; flex-direction: column; gap: var(--gap); position: sticky; top: var(--gap); height: calc(100dvh - 2 * var(--gap)); }

    .brand { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }

    .clock { font-size: 1.375rem; line-height: 1.2; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

    .about { padding: 16px 18px; font-size: .9375rem; line-height: 1.4; }
    .about strong { display: block; font-weight: 500; }
    .about span { color: var(--muted); }

    .steps { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: var(--gap); padding: 0; margin: 0; list-style: none; }
    .steps .group { font-size: .8125rem; color: var(--muted); padding: 10px 4px 0 6px; }
    .step {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      font: inherit; color: var(--dark-blue); background: var(--white); border: 0; border-radius: var(--radius);
      padding: 12px 16px 12px 12px; cursor: pointer; transition: background-color .25s ease, color .25s ease, transform .2s ease;
    }
    .step:hover { transform: translateX(3px); }
    .step .num {
      flex: none; width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center;
      font-family: var(--serif); font-size: 1.375rem; background: var(--page); transition: inherit;
    }
    .step .txt { flex: 1; min-width: 0; font-size: .9375rem; line-height: 1.3; }
    .step .txt span { display: block; color: #4A5464; font-size: .8125rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
    .step.answered .dot { background: var(--light-blue); border-color: var(--light-blue); }
    .step[aria-current="step"] { background: var(--dark-blue); color: var(--off-white); }
    .step[aria-current="step"] .num { background: var(--light-blue); color: var(--dark-blue); }
    .step[aria-current="step"] .txt span { color: rgba(254, 253, 251, .66); }

    /* ---------- Stage ---------- */
    .stage {
      position: relative; display: flex; flex-direction: column; min-height: calc(100dvh - 2 * var(--gap));
      padding: clamp(24px, 4vw, 56px); overflow: hidden;
      transition: background-color .45s ease, color .45s ease;
    }
    .stage-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: .9375rem; color: var(--muted); min-height: 40px; }
    .stage-top .where { display: flex; align-items: center; gap: 10px; }
    .stage-top .where::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--light-blue); }
    .content { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 820px; padding: 48px 0 24px; animation: enter .5s cubic-bezier(.2,.8,.2,1) both; }
    .content.back { animation-name: enter-back; }
    .content.leaving { animation: leave .22s ease both; }
    @keyframes enter { from { opacity: 0; transform: translateY(24px); } }
    @keyframes enter-back { from { opacity: 0; transform: translateY(-24px); } }
    @keyframes leave { to { opacity: 0; transform: translateY(-12px); } }

    .kicker { font-family: var(--serif); font-style: italic; font-size: 1.5rem; line-height: 1.2; margin: 0 0 12px; }
    .dark .kicker { color: var(--light-blue); }
    h1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.015em; margin: 0; }
    h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 1.05; }
    h2 { font-size: clamp(2rem, 4.2vw, 3rem); line-height: 1.1; }
    h1 em, h2 em { font-style: italic; color: var(--light-blue); }
    .lead { font-size: 1.125rem; line-height: 1.5; color: var(--muted); max-width: 560px; margin: 24px 0 0; }
    .help { font-size: 1rem; line-height: 1.5; color: var(--muted); max-width: 560px; margin: 16px 0 0; }
    .field { margin-top: 40px; }

    /* poster-style columns of facts along the bottom */
    .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: auto; padding-top: 32px; border-top: 1px solid var(--line); font-size: 1.125rem; line-height: 1.3; }
    .facts span { display: block; color: var(--muted); font-size: .8125rem; margin-bottom: 4px; }

    /* ---------- Inputs ---------- */
    .text-input, textarea {
      width: 100%; font: inherit; color: var(--ink); background: transparent; outline: none;
      border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0;
      font-size: 1.75rem; padding: 8px 0 14px; transition: border-color .2s ease;
    }
    textarea { font-size: 1.125rem; line-height: 1.55; min-height: 200px; resize: vertical; background: var(--soft); border: 1.5px solid transparent; border-radius: 12px; padding: 18px 20px; }
    .text-input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
    .text-input:focus { border-bottom-color: var(--ink); }
    textarea:focus { border-color: var(--ink); }

    .meter { display: flex; align-items: center; gap: 14px; margin-top: 14px; font-size: .875rem; color: var(--muted); }
    .track { flex: 0 1 220px; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
    .track span { display: block; height: 100%; width: 0; background: var(--light-blue); border-radius: inherit; transition: width .4s ease; }

    .choices { display: grid; gap: var(--gap); max-width: 520px; }
    .choice {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
      font: inherit; font-size: 1.125rem; color: var(--ink); background: var(--soft); border: 1.5px solid transparent;
      border-radius: 12px; padding: 12px 16px 12px 12px; transition: background-color .2s ease, border-color .2s ease;
    }
    .choice:hover { border-color: var(--ink); }
    .choice .key { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: .8125rem; font-weight: 600; background: var(--panel); }
    .choice[aria-checked="true"] { background: var(--dark-blue); color: var(--off-white); }
    .choice[aria-checked="true"] .key { background: var(--light-blue); color: var(--dark-blue); }
    .other-input { margin-top: 8px; font-size: 1.25rem; }

    /* Slider: a segmented track you can drag or tap */
    .slider { max-width: 620px; }
    .readout { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .readout b { font-family: var(--serif); font-weight: 400; font-size: clamp(2.25rem, 5vw, 3.5rem); line-height: 1; }
    .readout b.unset { color: var(--muted); font-style: italic; }
    .readout small { font-size: .9375rem; color: var(--muted); text-align: right; }
    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 56px; margin: 0; cursor: pointer; background: transparent;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 56px; border-radius: 12px;
      background: linear-gradient(to right, var(--light-blue) var(--fill, 0%), var(--soft) var(--fill, 0%));
    }
    input[type=range]::-moz-range-track { height: 56px; border-radius: 12px; background: var(--soft); }
    input[type=range]::-moz-range-progress { height: 56px; border-radius: 12px; background: var(--light-blue); }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 56px; height: 56px; border-radius: 12px; border: 0;
      background: var(--dark-blue); box-shadow: 0 0 0 4px var(--panel); transition: transform .15s ease;
    }
    input[type=range]::-moz-range-thumb { width: 56px; height: 56px; border-radius: 12px; border: 0; background: var(--dark-blue); }
    input[type=range]:active::-webkit-slider-thumb { transform: scale(.94); }
    input[type=range].unset::-webkit-slider-thumb { background: var(--muted); }
    input[type=range]:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 12px; }
    .stops { display: flex; justify-content: space-between; margin-top: 12px; }
    .stop { font: inherit; font-size: .9375rem; color: var(--muted); background: none; border: 0; padding: 6px 2px; cursor: pointer; }
    .stop[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
    .link-btn { font: inherit; font-size: .875rem; color: var(--muted); background: none; border: 0; padding: 0; margin-top: 16px; text-decoration: underline; cursor: pointer; }

    /* ---------- Buttons ---------- */
    .actions { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 40px; }
    .btn {
      display: inline-flex; align-items: center; gap: 14px; cursor: pointer;
      font: inherit; font-size: 1rem; font-weight: 500; color: var(--btn-ink); background: var(--btn-bg);
      border: 0; border-radius: 99px; padding: 8px 8px 8px 24px; transition: transform .15s ease, opacity .2s ease;
    }
    .btn .arrow {
      width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.125rem;
      background: var(--light-blue); color: var(--dark-blue); transition: transform .25s ease;
    }
    .dark .btn .arrow { background: var(--dark-blue); color: var(--light-blue); }
    .btn:hover .arrow { transform: rotate(-45deg); }
    .btn:active { transform: scale(.97); }
    .btn[disabled] { opacity: .55; cursor: wait; }
    .pill { font: inherit; font-size: .875rem; color: var(--ink); background: var(--soft); border: 0; border-radius: 99px; padding: 10px 16px; cursor: pointer; }
    .pill:hover { background: var(--line); }
    .hint { font-size: .8125rem; color: var(--muted); }
    .hint kbd { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }

    .error { margin-top: 20px; font-size: .9375rem; background: var(--soft); border-left: 3px solid var(--light-blue); padding: 12px 16px; border-radius: 8px; }
    .error a { color: inherit; }

    :focus-visible { outline: 2px solid var(--light-blue); outline-offset: 3px; }
    .text-input:focus-visible, textarea:focus-visible { outline: none; }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    /* Mobile: the rail folds into a slim top bar */
    .mobile-bar { display: none; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .rail { display: none; }
      .mobile-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; }
      .mobile-bar .logo { height: 24px; }
      .mobile-bar .progress { display: flex; align-items: center; gap: 10px; font-size: .8125rem; color: #4A5464; font-variant-numeric: tabular-nums; }
      .mobile-bar .track { width: 96px; flex: none; }
      .stage { min-height: calc(100dvh - 74px); padding: 20px 16px 24px; }
      .content { padding-top: 32px; }
      .facts { grid-template-columns: 1fr 1fr; font-size: 1rem; }
      .facts div:last-child { grid-column: span 2; }
      .text-input { font-size: 1.375rem; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Overview">
      <div class="panel brand">
        <div class="logo" role="img" aria-label="Koos"></div>
        <div class="clock" aria-label="Current time in Amsterdam"><div id="clock-date"></div><div id="clock-time"></div></div>
      </div>
      <div class="panel about">
        <strong>Koos &amp; Ko Roundtable</strong>
        <span id="about-text"></span>
      </div>
      <ol class="steps" id="steps"></ol>
    </aside>

    <div>
      <div class="panel mobile-bar">
        <div class="logo" role="img" aria-label="Koos"></div>
        <div class="progress"><span id="m-progress-label"></span><div class="track"><span id="m-progress-fill"></span></div></div>
      </div>
      <main class="panel stage" id="stage" aria-live="polite"></main>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script>
    // ---------- Data ----------

    // Copy of the Google Form. Answers are posted straight to `action`, so they land in the
    // form's own responses and linked Sheet. `entry` is Google's hidden field id for each
    // question: if a question is edited or added in the Google Form, update it here too.
    const FORM = {
      title: 'Which AI challenges are you facing?',
      description: 'Tell us what your challenges are for deciding on, building and launching AI products, processes, and services. We use your answers to seat you at the right roundtable.',
      originalUrl: 'https://docs.google.com/forms/d/e/1FAIpQLScqFjlbMQ7-OWaL1wNnHrtBrs_1oJgy2JKkpi-5AN4aCi5kMQ/viewform',
      action: 'https://docs.google.com/forms/d/e/1FAIpQLScqFjlbMQ7-OWaL1wNnHrtBrs_1oJgy2JKkpi-5AN4aCi5kMQ/formResponse',
      pageHistory: '0,1,2', // every page of the Google Form, so it accepts the answers from all of them
      sections: [
        { title: 'About you', help: 'Tell us a bit about yourself.', items: [
          { id: 1518823693, entry: 599453546, type: 'text', title: 'What is your name?', help: '', required: false },
          { id: 1699998064, entry: 371880519, type: 'text', title: 'What’s your job role?', help: '', required: false },
          { id: 1204841250, entry: 1743934678, type: 'text', title: 'Which organization do you work for?', help: '', required: false }
        ]},
        { title: 'Your biggest challenge', help: 'Tell us what you want to achieve with AI and what’s in your way. Think about your own situation and be honest about where you’re stuck helps us put you at the table that can actually move you forward.', items: [
          { id: 807275436, entry: 745463687, type: 'paragraph', title: 'Where do you get stuck with AI, what is your biggest challenge?', help: '', required: false },
          { id: 1730444328, entry: 2058185056, type: 'choice', title: 'In which phase does this challenge sit?', help: '', required: false, choices: ['Strategy', 'Build', 'Adoption'], hasOther: false }
        ]}
      ]
    };

    // Add ?preview to the URL to click through without sending anything.
    const PREVIEW = new URLSearchParams(location.search).has('preview');

    // ---------- Copy ----------

    // Short lines around the real questions. The question text itself is never changed.
    // Matched on the question title, so new or renamed questions fall back to generic lines.
    const FLAVOUR = [
      { match: /your name/i, kicker: 'First things first', short: 'Your name', placeholder: 'Type your name' },
      { match: /job role|role/i, kicker: 'The day job', short: 'Your role', placeholder: 'e.g. Head of Product' },
      { match: /organi[sz]ation|company/i, kicker: 'Your home base', short: 'Your organisation', placeholder: 'e.g. Acme Group' },
      { match: /phase/i, kicker: 'Slide it to where it hurts', short: 'The phase', slider: true,
        notes: { Strategy: 'Deciding what’s worth doing', Build: 'Making it actually work', Adoption: 'Getting people to use it' } },
      { match: /stuck|challenge/i, kicker: 'Be honest. Nobody’s grading this', short: 'Where you’re stuck', placeholder: 'The messier, the better.' }
    ];
    const GENERIC_KICKERS = ['Quick one', 'Over to you', 'Nearly there'];
    const SECTION_BUTTONS = ['Let’s start', 'Keep going', 'Onwards'];
    const METER_STEPS = [
      [0, 'Waiting for the good stuff'],
      [1, 'Warming up'],
      [60, 'Now we’re talking'],
      [180, 'This is gold'],
      [400, 'Pure roundtable fuel']
    ];

    function flavourFor(item) { return FLAVOUR.find(f => f.match.test(item.title)) || {}; }
    const pad = n => String(n).padStart(2, '0');

    // ---------- Screens ----------

    const screens = [{ kind: 'welcome' }];
    FORM.sections.forEach((section, s) => {
      if (section.title || section.help) screens.push({ kind: 'section', section, index: s });
      section.items.forEach(item => screens.push({ kind: 'question', item, section, sectionIndex: s }));
    });
    screens.push({ kind: 'done' });

    const questionScreens = screens.filter(s => s.kind === 'question');
    const answers = {};
    let current = 0;
    let submitting = false;
    let finished = false;

    const stage = document.getElementById('stage');

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v === true ? '' : v);
      }
      return put(node, children);
    }

    // Like node.append, but skips null so optional parts can be passed inline.
    function put(node, ...children) {
      children.flat(Infinity).forEach(c => c != null && node.append(c));
      return node;
    }

    function isEmpty(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length); }

    // ---------- Rail ----------

    function buildSteps() {
      const list = document.getElementById('steps');
      FORM.sections.forEach((section, s) => {
        list.append(el('li', { class: 'group', text: section.title || `Part ${s + 1}` }));
        section.items.forEach(item => {
          const q = questionScreens.findIndex(x => x.item === item);
          list.append(el('li', {},
            el('button', { class: 'step', type: 'button', 'data-item': item.id, onclick: () => { if (!submitting && !finished) go(screens.indexOf(questionScreens[q]), q < questionIndex() ? -1 : 1); } },
              el('span', { class: 'num', text: pad(q + 1) }),
              el('span', { class: 'txt' }, flavourFor(item).short || item.title, el('span', { class: 'answer' })),
              el('span', { class: 'dot', 'aria-hidden': 'true' }))
          ));
        });
      });
      document.getElementById('about-text').textContent = FORM.description;
    }

    function questionIndex() {
      const s = screens[current];
      return s.kind === 'question' ? questionScreens.indexOf(s) : -1;
    }

    function updateChrome() {
      const screen = screens[current];
      document.querySelectorAll('.step').forEach(btn => {
        const id = Number(btn.dataset.item);
        const value = answers[id];
        btn.classList.toggle('answered', !isEmpty(value));
        btn.querySelector('.answer').textContent = isEmpty(value) ? 'Not answered yet' : [].concat(value).join(', ');
        if (screen.kind === 'question' && screen.item.id === id) btn.setAttribute('aria-current', 'step');
        else btn.removeAttribute('aria-current');
      });
      const done = questionScreens.filter(s => !isEmpty(answers[s.item.id])).length;
      document.getElementById('m-progress-label').textContent = `${pad(Math.max(0, questionIndex()) + 1)} / ${pad(questionScreens.length)}`;
      document.getElementById('m-progress-label').style.visibility = screen.kind === 'question' ? 'visible' : 'hidden';
      document.getElementById('m-progress-fill').style.width = `${(finished ? 1 : done / questionScreens.length) * 100}%`;
    }

    function tickClock() {
      const now = new Date();
      const tz = 'Europe/Amsterdam';
      document.getElementById('clock-date').textContent =
        now.toLocaleDateString('en-GB', { timeZone: tz, weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('clock-time').textContent =
        'Amsterdam, ' + now.toLocaleTimeString('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    // ---------- Navigation ----------

    function go(to, direction = 1) {
      const old = stage.querySelector('.content');
      const render = () => {
        current = to;
        const screen = screens[current];
        stage.classList.toggle('dark', screen.kind !== 'question');
        stage.replaceChildren(buildTop(screen), buildScreen(screen, direction));
        updateChrome();
        window.scrollTo({ top: 0 });
        const focusable = stage.querySelector('[data-autofocus]');
        if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 300);
      };
      if (old) { old.classList.add('leaving'); setTimeout(render, 200); }
      else render();
    }

    function next() {
      const screen = screens[current];
      if (screen.kind === 'question') {
        const err = validate(screen.item);
        if (err) return showError(err);
        if (screen === questionScreens[questionScreens.length - 1]) return submit();
      }
      go(current + 1, 1);
    }

    function back() { if (current > 0 && !submitting) go(current - 1, -1); }

    function validate(item) {
      if (item.required && isEmpty(answers[item.id])) return 'This one’s required. Give it a go.';
      return null;
    }

    function showError(msg, html) {
      const content = stage.querySelector('.content');
      const box = content.querySelector('.error') || content.appendChild(el('div', { class: 'error', role: 'alert' }));
      if (html) box.innerHTML = html; else box.textContent = msg;
    }

    // ---------- Screen builders ----------

    function buildTop(screen) {
      let where = 'Koos & Ko Roundtable';
      if (screen.kind === 'section') where = `Part ${pad(screen.index + 1)} · ${screen.section.title}`;
      if (screen.kind === 'question') where = `${pad(questionScreens.indexOf(screen) + 1)} / ${pad(questionScreens.length)} · ${screen.section.title}`;
      const showBack = current > 0 && screen.kind !== 'done';
      return el('div', { class: 'stage-top' },
        el('span', { class: 'where', text: where }),
        showBack ? el('button', { class: 'pill', type: 'button', onclick: back, text: '← Back' }) : null);
    }

    function buildScreen(screen, direction) {
      const wrap = el('div', { class: 'content' + (direction < 0 ? ' back' : '') });
      if (screen.kind === 'welcome') return buildWelcome(wrap);
      if (screen.kind === 'section') return buildSection(wrap, screen);
      if (screen.kind === 'question') return buildQuestion(wrap, screen.item);
      return buildDone(wrap);
    }

    function buildWelcome(wrap) {
      const n = questionScreens.length;
      const minutes = Math.max(1, Math.round(n * 0.6));
      put(wrap,
        el('p', { class: 'kicker', text: 'Koos & Ko Roundtable' }),
        el('h1', { text: FORM.title }),
        el('p', { class: 'lead', text: FORM.description }),
        el('div', { class: 'actions' },
          el('button', { class: 'btn', type: 'button', onclick: next, 'data-autofocus': true },
            'Let’s go', el('span', { class: 'arrow', text: '→', 'aria-hidden': 'true' })))
      );
      stage.classList.add('dark');
      // Facts sit at the bottom of the panel, poster style
      queueMicrotask(() => stage.append(el('div', { class: 'facts' },
        el('div', {}, el('span', { text: 'Questions' }), String(n)),
        el('div', {}, el('span', { text: 'Time' }), `About ${minutes} min`),
        el('div', {}, el('span', { text: 'Wrong answers' }), 'Zero'))));
      return wrap;
    }

    function buildSection(wrap, screen) {
      const count = screen.section.items.length;
      put(wrap,
        el('p', { class: 'kicker', text: `Part ${screen.index + 1} of ${FORM.sections.length}` }),
        el('h1', { text: screen.section.title }),
        screen.section.help ? el('p', { class: 'lead', text: screen.section.help }) : null,
        el('div', { class: 'actions' },
          el('button', { class: 'btn', type: 'button', onclick: next, 'data-autofocus': true },
            SECTION_BUTTONS[screen.index] || 'Keep going', el('span', { class: 'arrow', text: '→', 'aria-hidden': 'true' })),
          el('span', { class: 'hint', text: `${count} question${count > 1 ? 's' : ''}` }))
      );
      return wrap;
    }

    function buildQuestion(wrap, item) {
      const flavour = flavourFor(item);
      const qIndex = questionScreens.findIndex(s => s.item === item);
      const isLast = qIndex === questionScreens.length - 1;
      const inputId = 'q-' + item.id;

      put(wrap,
        el('p', { class: 'kicker', text: flavour.kicker || GENERIC_KICKERS[qIndex % GENERIC_KICKERS.length] }),
        el('h2', { id: inputId + '-label' }, item.title, item.required ? el('em', { text: ' *', 'aria-label': 'required' }) : null),
        item.help ? el('p', { class: 'help', text: item.help }) : null
      );

      const field = el('div', { class: 'field' });
      let hint = null;
      if (item.type === 'text') {
        const input = el('input', {
          class: 'text-input', id: inputId, type: 'text', autocomplete: 'off',
          placeholder: flavour.placeholder || 'Type your answer', 'aria-labelledby': inputId + '-label',
          'data-autofocus': true, required: item.required,
          oninput: e => { answers[item.id] = e.target.value; updateChrome(); },
          onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); next(); } }
        });
        input.value = answers[item.id] || '';
        field.append(input);
        hint = el('span', { class: 'hint' }, 'or press ', el('kbd', { text: 'Enter' }));
      } else if (item.type === 'paragraph') {
        field.append(buildParagraph(item, flavour, inputId));
        hint = el('span', { class: 'hint' }, 'or press ', el('kbd', { text: navigator.platform.includes('Mac') ? '⌘ Enter' : 'Ctrl Enter' }));
      } else if ((item.type === 'choice' && flavour.slider && !item.hasOther) || item.type === 'scale') {
        field.append(buildSlider(item, flavour, inputId));
      } else if (item.type === 'choice' || item.type === 'checkbox') {
        field.append(buildChoices(item, inputId));
        hint = el('span', { class: 'hint' }, 'tip: press ', el('kbd', { text: 'A' }), ' ', el('kbd', { text: 'B' }), ' …');
      } else {
        field.append(el('p', { class: 'help' }, 'This question type isn’t in the new interface yet. ',
          el('a', { href: FORM.originalUrl, target: '_blank', rel: 'noopener', style: 'color:inherit', text: 'Answer it in the original form' }), '.'));
      }

      put(wrap, field, el('div', { class: 'actions' },
        el('button', { class: 'btn', type: 'button', onclick: next, id: 'next-btn' },
          isLast ? 'Send it' : 'Next', el('span', { class: 'arrow', text: isLast ? '↗' : '→', 'aria-hidden': 'true' })),
        hint
      ));
      return wrap;
    }

    function buildParagraph(item, flavour, inputId) {
      const fill = el('span');
      const label = el('span');
      const area = el('textarea', {
        id: inputId, 'aria-labelledby': inputId + '-label', placeholder: flavour.placeholder || 'Type your answer',
        'data-autofocus': true, required: item.required,
        oninput: e => { answers[item.id] = e.target.value; updateMeter(); updateChrome(); },
        onkeydown: e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); next(); } }
      });
      area.value = answers[item.id] || '';
      function updateMeter() {
        const len = area.value.trim().length;
        const step = [...METER_STEPS].reverse().find(([min]) => len >= min);
        label.textContent = step[1];
        fill.style.width = Math.min(100, (len / 400) * 100) + '%';
      }
      updateMeter();
      return el('div', {}, area, el('div', { class: 'meter', 'aria-live': 'polite' },
        el('div', { class: 'track', 'aria-hidden': 'true' }, fill), label));
    }

    function buildSlider(item, flavour, inputId) {
      // Choice questions use their options as stops; scale questions use their numbers.
      const stops = item.type === 'scale'
        ? Array.from({ length: item.max - item.min + 1 }, (_, i) => String(item.min + i))
        : item.choices;
      const notes = flavour.notes || {};
      const valueEl = el('b', { 'aria-hidden': 'true' });
      const subEl = el('small', { 'aria-hidden': 'true' });
      const range = el('input', {
        type: 'range', id: inputId, min: 0, max: stops.length - 1, step: 1,
        'aria-labelledby': inputId + '-label', 'data-autofocus': true,
        oninput: e => set(stops[Number(e.target.value)])
      });
      const stopButtons = stops.map(s => el('button', { class: 'stop', type: 'button', text: s, onclick: () => set(s) }));
      const clear = el('button', { class: 'link-btn', type: 'button', text: 'Clear my answer', onclick: () => set(null) });

      function set(value) {
        answers[item.id] = value === null ? '' : (item.type === 'scale' ? Number(value) : value);
        render();
        updateChrome();
      }
      function render() {
        const v = answers[item.id];
        const idx = isEmpty(v) ? -1 : stops.indexOf(String(v));
        range.classList.toggle('unset', idx < 0);
        range.value = Math.max(0, idx);
        // keep the fill reaching the middle of the thumb at every stop
        range.style.setProperty('--fill', idx < 0 ? '0%' : `calc(${(idx / (stops.length - 1)) * 100}% + ${28 - (idx / (stops.length - 1)) * 56}px)`);
        range.setAttribute('aria-valuetext', idx < 0 ? 'No answer yet' : stops[idx]);
        valueEl.classList.toggle('unset', idx < 0);
        valueEl.textContent = idx < 0 ? 'Drag me' : stops[idx];
        subEl.textContent = idx < 0
          ? (item.type === 'scale' ? `${item.minLabel || stops[0]} to ${item.maxLabel || stops[stops.length - 1]}` : 'or tap a phase below')
          : (notes[stops[idx]] || (idx === 0 && item.minLabel) || (idx === stops.length - 1 && item.maxLabel) || '');
        stopButtons.forEach((b, i) => b.setAttribute('aria-pressed', String(i === idx)));
        clear.hidden = idx < 0 || item.required;
      }
      render();
      return el('div', { class: 'slider' }, el('div', { class: 'readout' }, valueEl, subEl), range, el('div', { class: 'stops' }, stopButtons), clear);
    }

    function buildChoices(item, inputId) {
      const multi = item.type === 'checkbox';
      const options = item.choices.slice();
      const box = el('div', { class: 'choices', role: multi ? 'group' : 'radiogroup', 'aria-labelledby': inputId + '-label' });
      const otherInput = item.hasOther ? el('input', {
        class: 'text-input other-input', type: 'text', placeholder: 'Your own answer', hidden: true,
        oninput: () => sync()
      }) : null;
      let otherOn = false;

      const selected = () => [].concat(answers[item.id] || []);
      if (item.hasOther) {
        const known = selected().filter(v => !options.includes(v));
        if (known.length) { otherOn = true; otherInput.value = known[0]; }
      }

      const cards = options.map((label, i) => el('button', {
        class: 'choice', type: 'button', role: multi ? 'checkbox' : 'radio', 'data-autofocus': i === 0 || null,
        onclick: () => toggle(label)
      }, el('span', { class: 'key', text: String.fromCharCode(65 + i) }), label));
      if (item.hasOther) {
        cards.push(el('button', { class: 'choice', type: 'button', role: multi ? 'checkbox' : 'radio', onclick: () => toggleOther() },
          el('span', { class: 'key', text: String.fromCharCode(65 + options.length) }), 'Other'));
      }

      function toggle(label) {
        if (multi) {
          const set = selected().filter(v => options.includes(v));
          const i = set.indexOf(label);
          i < 0 ? set.push(label) : set.splice(i, 1);
          answers[item.id] = set;
          sync();
        } else {
          otherOn = false;
          answers[item.id] = answers[item.id] === label ? '' : label;
          render();
          if (answers[item.id]) setTimeout(next, 450); // single choice: hop to the next question
        }
      }
      function toggleOther() {
        otherOn = !otherOn;
        if (!multi && otherOn) answers[item.id] = otherInput.value;
        sync();
        if (otherOn) otherInput.focus();
      }
      function sync() {
        const other = otherOn && otherInput ? otherInput.value.trim() : '';
        if (multi) {
          const set = selected().filter(v => options.includes(v));
          if (other) set.push(other);
          answers[item.id] = set;
        } else if (otherOn) {
          answers[item.id] = other;
        }
        render();
      }
      function render() {
        const sel = selected();
        cards.forEach((c, i) => c.setAttribute('aria-checked', String(i < options.length ? sel.includes(options[i]) : otherOn)));
        if (otherInput) otherInput.hidden = !otherOn;
        updateChrome();
      }
      render();

      box.addEventListener('keydown', e => {
        const i = e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) - 65 : -1;
        if (i >= 0 && i < cards.length && e.target.tagName !== 'INPUT') { e.preventDefault(); cards[i].click(); }
      });
      box.append(...cards);
      if (otherInput) box.append(otherInput);
      return box;
    }

    function buildDone(wrap) {
      const nameItem = questionScreens.map(s => s.item).find(i => /your name/i.test(i.title));
      const first = nameItem && answers[nameItem.id] ? String(answers[nameItem.id]).trim().split(/\s+/)[0] : '';
      put(wrap,
        el('p', { class: 'kicker', text: 'Sent' }),
        el('h1', {}, first ? `Thanks, ${first}.` : 'Thanks.', el('br'), el('em', { text: 'See you at the table.' })),
        el('p', { class: 'lead', text: 'Your answers are in. We’ll use them to find you the table that can actually move you forward.' })
      );
      setTimeout(confetti, 300);
      return wrap;
    }

    // ---------- Submit ----------

    function submit() {
      if (submitting) return;
      const missing = questionScreens.find(s => validate(s.item));
      if (missing) return go(screens.indexOf(missing), -1);

      submitting = true;
      const btn = document.getElementById('next-btn');
      btn.disabled = true;
      btn.firstChild.textContent = 'Sending…';

      const done = () => { submitting = false; finished = true; go(screens.length - 1, 1); };
      const fail = err => {
        submitting = false;
        btn.disabled = false;
        btn.firstChild.textContent = 'Try again';
        showError(null, 'That didn’t go through, but your answers are still here. Try again, or use the ' +
          `<a href="${FORM.originalUrl}" target="_blank" rel="noopener">original form</a>.`);
        console.error(err);
      };

      if (PREVIEW) {
        console.info('Preview mode, not submitted:', JSON.stringify(answers));
        return setTimeout(done, 700);
      }

      const body = new URLSearchParams();
      questionScreens.forEach(({ item }) => {
        const value = answers[item.id];
        if (isEmpty(value)) return;
        [].concat(value).forEach(v => {
          const text = String(v).trim();
          if (item.hasOther && !item.choices.includes(text)) {
            body.append(`entry.${item.entry}`, '__other_option__');
            body.append(`entry.${item.entry}.other_option_response`, text);
          } else {
            body.append(`entry.${item.entry}`, text);
          }
        });
      });
      body.append('pageHistory', FORM.pageHistory);

      // Google doesn't let a page read the form's reply ("no-cors"), so a network
      // error is the only failure we can see. Test with a real submission after edits.
      fetch(FORM.action, { method: 'POST', mode: 'no-cors', body }).then(done, fail);
    }

    // ---------- Confetti ----------

    function confetti() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
      ctx.scale(dpr, dpr);
      const colours = ['#00B9F2', '#FEFDFB', '#001820', '#00B9F2'];
      const bits = Array.from({ length: 140 }, () => ({
        x: innerWidth * .6 + (Math.random() - .5) * 240, y: innerHeight * .6,
        vx: (Math.random() - .5) * 16, vy: -Math.random() * 18 - 6,
        r: Math.random() * 5 + 3, c: colours[Math.floor(Math.random() * colours.length)],
        a: Math.random() * Math.PI, va: (Math.random() - .5) * .3
      }));
      const start = performance.now();
      (function frame(t) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        bits.forEach(b => {
          b.vy += .45; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.a += b.va;
          ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c;
          ctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);
          ctx.restore();
        });
        if (t - start < 3500) requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, innerWidth, innerHeight);
      })(start);
    }

    // ---------- Start ----------

    buildSteps();
    tickClock();
    setInterval(tickClock, 1000);
    go(0);
  </script>
</body>
</html>
